<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>买菜价格追踪</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --text: #1f2421; --muted: #6b706c;
    --line: #e4e2dc; --accent: #2f7d4f; --down: #2f7d4f; --up: #c2452d; --chip: #eef3ef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161917; --card: #1f2321; --text: #e9ece9; --muted: #9aa19c;
      --line: #2e3430; --accent: #5cbf85; --down: #5cbf85; --up: #ef7a62; --chip: #26302a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 4px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover td, tr.row.sel td { background: var(--chip); }
  .store { font-size: 12px; background: var(--chip); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .down { color: var(--down); } .up { color: var(--up); }
  .hit { font-size: 12px; color: #fff; background: var(--down); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .muted { color: var(--muted); }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); min-width: 0; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  #detail h2 { font-size: 17px; margin: 0 0 2px; }
  .chartbox { position: relative; height: 260px; margin: 12px 0; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .tablewrap { overflow-x: auto; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; display: none; max-width: calc(100% - 32px); }
  @media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <h1>买菜价格追踪</h1>
  <p class="sub">点一行查看价格走势、手动记录新价格。降价和达到目标价的商品会高亮。</p>

  <div class="card">
    <div class="toolbar" id="filters"></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>商品</th><th>超市</th><th class="num">现价</th><th class="num">变化</th>
          <th class="num hide-sm">最低</th><th class="num hide-sm">目标</th><th class="hide-sm">更新</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" style="display:none">还没有商品，在下面添加第一个吧。</div>
  </div>

  <div class="card" id="detail" style="display:none">
    <h2 id="d-title"></h2>
    <div class="muted" id="d-meta"></div>
    <div class="chartbox"><canvas id="chart"></canvas></div>
    <form id="record-form">
      <input name="price" type="number" step="0.01" min="0" placeholder="新价格 $" required>
      <input name="note" placeholder="备注（打折、会员价…）">
      <button type="submit">记录价格</button>
      <button type="button" class="ghost" id="delete-btn">删除这个商品</button>
    </form>
  </div>

  <div class="card">
    <h2 style="font-size:17px;margin:0 0 12px">添加商品</h2>
    <form id="add-form">
      <input name="name" placeholder="商品名，如 鸡蛋 24 个" required>
      <select name="store" id="store-select" required></select>
      <input name="price" type="number" step="0.01" min="0" placeholder="当前价格 $（可选）">
      <input name="target_price" type="number" step="0.01" min="0" placeholder="目标价 $（可选）">
      <input name="unit" placeholder="规格，如 1 lb（可选）">
      <input name="url" type="url" placeholder="商品链接（可选，用于自动抓价）">
      <button type="submit">添加</button>
    </form>
  </div>
</main>
<div id="toast"></div>

<script>
let state = { stores: {}, items: [], filter: "all", selected: null };
let chart;
const $ = (s) => document.querySelector(s);
const money = (v) => v == null ? "–" : "$" + Number(v).toFixed(2);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 3500);
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "请求失败");
  return data;
}

async function load() {
  const data = await api("/api/items");
  state.stores = data.stores; state.items = data.items;
  renderFilters(); renderRows();
  $("#store-select").innerHTML = Object.entries(state.stores).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  if (state.selected) showDetail(state.selected);
}

function renderFilters() {
  const used = [...new Set(state.items.map((i) => i.store))];
  const chips = [["all", "全部"], ...used.map((k) => [k, state.stores[k] || k])];
  $("#filters").innerHTML = chips.map(([k, v]) => `<button class="chip ${state.filter === k ? "on" : ""}" data-k="${k}">${esc(v)}</button>`).join("");
  $("#filters").querySelectorAll(".chip").forEach((b) => b.onclick = () => { state.filter = b.dataset.k; renderFilters(); renderRows(); });
}

function renderRows() {
  const items = state.items.filter((i) => state.filter === "all" || i.store === state.filter);
  $("#empty").style.display = state.items.length ? "none" : "block";
  $("#rows").innerHTML = items.map((i) => {
    let change = '<span class="muted">–</span>';
    if (i.latest != null && i.previous != null && i.latest !== i.previous) {
      const d = i.latest - i.previous, pct = (d / i.previous * 100).toFixed(0);
      change = `<span class="${d < 0 ? "down" : "up"}">${d < 0 ? "▼" : "▲"} ${money(Math.abs(d))} (${pct}%)</span>`;
    }
    const hit = i.target_price != null && i.latest != null && i.latest <= i.target_price ? '<span class="hit">目标价</span>' : "";
    return `<tr class="row ${state.selected === i.id ? "sel" : ""}" data-id="${i.id}">
      <td>${esc(i.name)}${i.unit ? ` <span class="muted">${esc(i.unit)}</span>` : ""}${hit}</td>
      <td><span class="store">${esc(state.stores[i.store] || i.store)}</span></td>
      <td class="num">${money(i.latest)}</td><td class="num">${change}</td>
      <td class="num hide-sm">${money(i.lowest)}</td><td class="num hide-sm">${money(i.target_price)}</td>
      <td class="hide-sm muted">${i.latest_at ? i.latest_at.slice(5, 16).replace("T", " ") : "–"}</td></tr>`;
  }).join("");
  $("#rows").querySelectorAll("tr.row").forEach((r) => r.onclick = () => showDetail(Number(r.dataset.id)));
}

async function showDetail(id) {
  const item = state.items.find((i) => i.id === id);
  if (!item) { state.selected = null; $("#detail").style.display = "none"; return; }
  state.selected = id; renderRows();
  $("#detail").style.display = "block";
  $("#d-title").textContent = item.name;
  const link = item.url ? ` · <a href="${esc(item.url)}" target="_blank" rel="noopener">商品页</a>` : " · 无链接，手动记录";
  $("#d-meta").innerHTML = `${esc(state.stores[item.store] || item.store)}${link}`;
  const hist = await api("/api/history/" + id);
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim(), muted = css.getPropertyValue("--muted").trim(), line = css.getPropertyValue("--line").trim();
  const datasets = [{ label: "价格", data: hist.map((h) => h.price), borderColor: accent, backgroundColor: accent,
    tension: 0.2, pointRadius: 4, stepped: false }];
  if (item.target_price != null) datasets.push({ label: "目标价", data: hist.map(() => item.target_price),
    borderColor: muted, borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5 });
  if (chart) chart.destroy();
  chart = new Chart($("#chart"), {
    type: "line",
    data: { labels: hist.map((h) => h.recorded_at.slice(0, 10)), datasets },
    options: {
      maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: datasets.length > 1, labels: { color: muted } },
        tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${money(c.parsed.y)}`,
          afterLabel: (c) => c.datasetIndex === 0 ? [hist[c.dataIndex].source === "auto" ? "自动抓取" : "手动记录", hist[c.dataIndex].note].filter(Boolean).join(" · ") : "" } } },
      scales: { x: { ticks: { color: muted }, grid: { color: line } },
        y: { ticks: { color: muted, callback: (v) => money(v) }, grid: { color: line } } },
    },
  });
}

$("#record-form").onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    const r = await api("/api/prices", { item_id: state.selected, price: f.get("price"), note: f.get("note") });
    e.target.reset(); toast(r.alerts.length ? "🔔 " + r.alerts.join("；") : "已记录"); load();
  } catch (err) { toast(err.message); }
};

$("#delete-btn").onclick = async () => {
  if (!confirm("删除这个商品和它所有的价格记录？")) return;
  await api(`/api/items/${state.selected}/delete`, {});
  state.selected = null; $("#detail").style.display = "none"; load();
};

$("#add-form").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await api("/api/items", Object.fromEntries(new FormData(e.target)));
    e.target.reset(); state.selected = r.id; toast("已添加"); load();
  } catch (err) { toast(err.message); }
};

load();
</script>
</body>
</html>
