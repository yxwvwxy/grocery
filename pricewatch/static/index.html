<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grocery Price Compare</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f6f2; --card: #fcfcfb; --text: #1f2421; --muted: #6b706c;
    --line: #e4e2dc; --accent: #2f7d4f; --down: #2f7d4f; --up: #c2452d; --chip: #eef3ef; --best: #e3f1e8;
    /* Stores are identified by their app icon everywhere except the chart, where lines
       need distinct hues — this palette is for the chart only, not brand colors. */
    --s-shoprite: #0066ff; --s-hmart: #ff8000; --s-costco: #00a651;
    --s-ranch99: #ff0000; --s-target: #8000ff; --s-walmart: #ffd700;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #141614; --card: #1a1a19; --text: #f0efec; --muted: #a8aba6;
      --line: #2e3230; --accent: #5cbf85; --down: #5cbf85; --up: #ef7a62; --chip: #252b27; --best: #1f3327;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Helvetica Neue", "PingFang SC", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .muted { color: var(--muted); }
  .zh { color: var(--muted); margin-left: 6px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover td, tr.row.sel td { background: var(--chip); }
  #matrix td:nth-child(-n+2) { white-space: nowrap; }
  td.cell { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.cell .u { font-weight: 600; }
  td.cell .p { display: block; font-size: 12px; color: var(--muted); }
  td.cell.best { background: var(--best); }
  tr.row:hover td.cell.best, tr.row.sel td.cell.best { background: var(--best); }
  .tag { font-size: 11px; color: #fff; background: var(--down); border-radius: 6px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
  .store-icon { width: 16px; height: 16px; border-radius: 4px; margin-right: 6px; vertical-align: -3px; object-fit: cover; }
  .thumb { display: inline-block; width: 56px; height: 56px; border-radius: 8px; object-fit: contain; background: var(--chip); border: 1px solid var(--line); }
  .thumb.empty { background: transparent; }
  .down { color: var(--down); } .up { color: var(--up); }
  .bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 10px; align-items: center; margin: 12px 0 4px; }
  .bars .track { height: 14px; }
  .bars .bar { height: 14px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .bars .val { font-variant-numeric: tabular-nums; font-size: 13px; }
  .chartbox { position: relative; height: 260px; margin: 16px 0 8px; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); min-width: 0; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .section-label { font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 12px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; display: none; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<main>
  <h1>Grocery Price Compare</h1>
  <p class="sub">Unit prices of the same product across your stores. The cheapest store is highlighted; click a product to see its price history.</p>
  <p style="background:#ffe08a;color:#1f2421;padding:6px 10px;border-radius:6px;font-weight:600;display:inline-block;margin:0 0 16px">
    页面版本 / Build: {{BUILD}}</p>

  <div class="card">
    <form id="search-form" style="display:flex;gap:8px">
      <input id="search" type="search" placeholder="Search products… e.g. egg" style="flex:1">
      <button type="submit">Search</button>
    </form>
  </div>

  <div class="card" id="results-card" style="display:none">
    <div id="results"></div>
    <div id="no-match" class="empty" style="display:none">No products match your search.</div>
  </div>

  <div class="card" id="matrix-card">
    <div class="tablewrap"><table id="matrix"></table></div>
    <div id="empty" class="empty" style="display:none">No products yet.</div>
  </div>

  <div class="card" id="detail" style="display:none">
    <h2 id="d-title"></h2>
    <div class="muted" id="d-meta"></div>
    <div class="section-label">Latest unit price by store</div>
    <div class="bars" id="bars"></div>
    <div class="section-label">Unit price history</div>
    <div class="chartbox"><canvas id="chart" aria-label="Unit price history by store"></canvas></div>
    <p style="margin:12px 0 0"><button type="button" class="ghost" id="delete-btn">Delete product</button></p>
  </div>
</main>
<div id="toast"></div>

<script>
let state = { stores: {}, products: [], selected: null, query: "" };
let chart;
const $ = (s) => document.querySelector(s);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const storeColor = (k) => css("--s-" + k) || css("--muted"); // chart line color only — see note above
const storeBadge = (k) => `<img class="store-icon" src="icons/${k}.png" alt="${esc(state.stores[k] || k)}">`;
const money = (v) => v == null ? "–" : "$" + Number(v).toFixed(2);
const unitMoney = (v) => v == null ? "–" : "$" + Number(v).toFixed(2);
const qtyText = (q) => q === 1 ? "" : ` / ${+q.toFixed(3)}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nameHtml = (p) => `${esc(p.name)}${p.name_zh ? `<span class="zh">${esc(p.name_zh)}</span>` : ""}`;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 4000);
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function load() {
  const data = await api("/api/products");
  state.stores = data.stores; state.products = data.products;
  render();
  if (state.selected) showDetail(state.selected);
}

function matchedProducts() {
  const q = state.query.trim().toLowerCase();
  if (!q) return null;
  return state.products.filter((p) => p.name.toLowerCase().includes(q) || (p.name_zh || "").toLowerCase().includes(q));
}

// Search is a standalone lookup: type a keyword, see every matching product ranked
// cheapest-first across stores. It never requires or opens the add/edit form.
function render() {
  const matches = matchedProducts();
  $("#results-card").style.display = matches ? "block" : "none";
  $("#matrix-card").style.display = matches ? "none" : "block";
  if (matches) renderResults(matches); else renderMatrix(state.products);
}

// Notes are recorded as "<brand/variant>, <date>查价" — show just the brand/variant part.
// Prefer the listing's own variant (brand/size); fall back to parsing it out of the price note
// for older listings recorded before per-variant tracking existed.
const itemLabel = (l) => {
  if (l.variant) return esc(l.variant);
  const note = l.note;
  return note ? esc(note.replace(/[,，]\s*\d{1,2}\/\d{1,2}查价\s*$/, "")) : '<span class="muted">—</span>';
};

function renderResults(ps) {
  $("#no-match").style.display = ps.length ? "none" : "block";
  $("#results").innerHTML = ps.map((p) => {
    const priced = p.listings.filter((l) => l.unit_price != null); // already ranked cheapest-first by the server
    const rows = priced.length
      ? priced.map((l, i) => `<tr><td>${i + 1}</td>
          <td>${l.image_url ? `<img src="${esc(l.image_url)}" alt="" class="thumb">` : '<span class="thumb empty"></span>'}</td>
          <td>${storeBadge(l.store)}${esc(state.stores[l.store])}</td>
          <td>${itemLabel(l)}</td>
          <td class="num"><span class="u">${unitMoney(l.unit_price)}</span>/${esc(p.unit)}${i === 0 ? ' <span class="tag">Cheapest</span>' : ""}</td>
          <td class="num muted">${money(l.price)}${qtyText(l.qty)}</td></tr>`).join("")
      : `<tr><td colspan="6" class="muted">No prices logged yet</td></tr>`;
    return `<div style="margin-bottom:20px">
      <h2 style="margin-bottom:8px" class="row" data-id="${p.id}">${nameHtml(p)}</h2>
      <div class="muted" style="margin:-6px 0 8px">per ${esc(p.unit)}</div>
      <div class="tablewrap"><table><thead><tr><th>#</th><th></th><th>Store</th><th>Item</th><th class="num">Unit price</th><th class="num">Pack</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    </div>`;
  }).join("");
  $("#results").querySelectorAll("h2.row").forEach((h) => h.onclick = () => toggleDetail(Number(h.dataset.id)));
}

// Rows are products, columns are the stores that have at least one price.
function renderMatrix(ps) {
  $("#empty").style.display = ps.length ? "none" : "block";
  if (!ps.length) { $("#matrix").innerHTML = ""; return; }
  const used = Object.keys(state.stores).filter((k) => ps.some((p) => p.listings.some((l) => l.store === k && l.unit_price != null)));
  const head = `<tr><th>Product</th><th>Unit</th>${used.map((k) =>
    `<th class="num">${storeBadge(k)}${esc(state.stores[k])}</th>`).join("")}<th>Cheapest</th></tr>`;
  const rows = ps.map((p) => {
    // listings are pre-sorted cheapest-first; keep only each store's cheapest variant for this overview row
    const by = {};
    for (const l of p.listings) if (!(l.store in by)) by[l.store] = l;
    const best = p.listings.find((l) => l.store === p.best_store);
    const hit = best && p.target_price != null && best.unit_price <= p.target_price ? '<span class="tag">Target hit</span>' : "";
    const cells = used.map((k) => {
      const l = by[k];
      if (!l || l.unit_price == null) return '<td class="cell muted">–</td>';
      let trend = "";
      if (l.previous_unit_price != null && Math.abs(l.unit_price - l.previous_unit_price) > 1e-9)
        trend = l.unit_price < l.previous_unit_price ? ' <span class="down" title="Lower than last time">▼</span>' : ' <span class="up" title="Higher than last time">▲</span>';
      return `<td class="cell ${k === p.best_store ? "best" : ""}" title="${esc(l.note || "")}"><span class="u">${unitMoney(l.unit_price)}</span>${trend}
        <span class="p">${money(l.price)}${qtyText(l.qty)}</span>
        <span class="p item">${itemLabel(l)}</span></td>`;
    }).join("");
    let cheapest = '<span class="muted">No prices yet</span>';
    if (best) {
      const others = p.listings.filter((l) => l.unit_price != null && l.store !== best.store);
      const save = others.length ? ` <span class="muted">saves ${Math.round((1 - best.unit_price / others[others.length - 1].unit_price) * 100)}% vs priciest</span>` : "";
      cheapest = `${storeBadge(best.store)}${esc(state.stores[best.store])}${save}`;
    }
    return `<tr class="row ${state.selected === p.id ? "sel" : ""}" data-id="${p.id}">
      <td>${nameHtml(p)}${hit}</td><td class="muted">per ${esc(p.unit)}</td>${cells}<td>${cheapest}</td></tr>`;
  }).join("");
  $("#matrix").innerHTML = `<thead>${head}</thead><tbody>${rows}</tbody>`;
  $("#matrix").querySelectorAll("tr.row").forEach((r) => r.onclick = () => toggleDetail(Number(r.dataset.id)));
}

function toggleDetail(id) {
  if (state.selected === id) { state.selected = null; $("#detail").style.display = "none"; render(); return; }
  showDetail(id);
}

async function showDetail(id) {
  const p = state.products.find((x) => x.id === id);
  if (!p) { state.selected = null; $("#detail").style.display = "none"; return; }
  state.selected = id; render();
  $("#detail").style.display = "block";
  $("#d-title").innerHTML = nameHtml(p);
  $("#d-meta").textContent = `Compared per ${p.unit}` + (p.target_price != null ? ` · target ${unitMoney(p.target_price)}/${p.unit}` : "");

  const priced = p.listings.filter((l) => l.unit_price != null);
  const max = Math.max(...priced.map((l) => l.unit_price), 0);
  $("#bars").innerHTML = priced.length ? priced.map((l) => `
    <div>${storeBadge(l.store)}${esc(state.stores[l.store])}</div>
    <div class="track"><div class="bar" style="width:${(l.unit_price / max * 100).toFixed(1)}%;background:${storeColor(l.store)}"
      title="${esc(state.stores[l.store])}: ${unitMoney(l.unit_price)}/${esc(p.unit)} (${money(l.price)}${qtyText(l.qty)})"></div></div>
    <div class="val">${unitMoney(l.unit_price)}/${esc(p.unit)}${l.store === p.best_store ? ' <span class="tag">Cheapest</span>' : ""}</div>`).join("")
    : '<div class="muted" style="grid-column:1/-1">No prices yet.</div>';

  const hist = await api("/api/history/" + id);

  const muted = css("--muted"), line = css("--line");
  const when = (h) => h.recorded_at.slice(5, 16).replace("T", " ");
  const stores = Object.keys(state.stores).filter((k) => hist.some((h) => h.store === k));
  const datasets = stores.map((k) => ({
    label: state.stores[k],
    data: hist.filter((h) => h.store === k).map((h) => ({ x: when(h), y: h.unit_price, h })),
    borderColor: storeColor(k), backgroundColor: storeColor(k), borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, tension: 0, spanGaps: true,
  }));
  if (p.target_price != null) datasets.push({ label: "Target", data: [], borderColor: muted, borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0 });
  const labels = [...new Set(hist.map(when))];
  if (p.target_price != null) datasets[datasets.length - 1].data = labels.map((x) => ({ x, y: p.target_price }));
  if (chart) chart.destroy();
  chart = new Chart($("#chart"), {
    type: "line",
    data: { labels, datasets },
    options: {
      maintainAspectRatio: false, interaction: { mode: "nearest", intersect: false },
      plugins: {
        title: { display: true, text: p.name + (p.name_zh ? ` ${p.name_zh}` : ""), color: css("--text"), font: { size: 13, weight: "normal" }, padding: { bottom: 12 } },
        legend: { display: datasets.length > 1, labels: { color: muted, boxWidth: 12, boxHeight: 2 } },
        tooltip: { callbacks: {
          title: (items) => `${p.name}${p.name_zh ? " " + p.name_zh : ""} — ${items[0]?.label ?? ""}`,
          label: (c) => `${c.dataset.label}: ${unitMoney(c.parsed.y)}/${p.unit}`,
          afterLabel: (c) => { const h = c.raw.h; return h ? [`${money(h.price)}${qtyText(h.qty)}`, h.note].filter(Boolean).join(" · ") : ""; },
        } },
      },
      scales: {
        x: { type: "category", ticks: { color: muted }, grid: { display: false } },
        y: { ticks: { color: muted, callback: (v) => unitMoney(v) }, grid: { color: line } },
      },
    },
  });
}

$("#search").oninput = (e) => { state.query = e.target.value; render(); };
$("#search-form").onsubmit = (e) => { e.preventDefault(); state.query = $("#search").value; render(); };

$("#delete-btn").onclick = async () => {
  if (!confirm("Delete this product and all of its prices?")) return;
  await api(`/api/products/${state.selected}/delete`, {});
  state.selected = null; $("#detail").style.display = "none"; load();
};

load();
</script>
</body>
</html>
